title: "RAOS — Regulatory-Aware Agentic Orchestration"
description: "AI-powered compliance orchestration for Life Sciences. Extract, enforce, and audit GxP processes with autonomous agents."
url: ""
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: pretty

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default

collections:
  features:
    output: false
